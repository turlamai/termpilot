name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# One release pipeline per tag at a time; never cancel a publishing run.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches package.json, backend app-version, and CHANGELOG
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "manual dispatch: skipping tag validation, building from package.json version"
            exit 0
          fi
          TAG="${GITHUB_REF_NAME#v}"
          ROOT_VERSION=$(node -p "require('./package.json').version")
          BACKEND_VERSION=$(sed -n 's/.*(define app-version "\([^"]*\)").*/\1/p' backend/main.rkt)
          echo "tag=$TAG package.json=$ROOT_VERSION backend=$BACKEND_VERSION"
          test -n "$BACKEND_VERSION" || { echo "::error::backend/main.rkt has no app-version"; exit 1; }
          test "$TAG" = "$ROOT_VERSION" || { echo "::error::tag $TAG != package.json $ROOT_VERSION"; exit 1; }
          test "$TAG" = "$BACKEND_VERSION" || { echo "::error::tag $TAG != backend app-version $BACKEND_VERSION"; exit 1; }
          grep -q "^## \[$TAG\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no '## [$TAG]' section"; exit 1; }

  linux:
    name: Linux package
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$(node -p "require('./package.json').version")"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - uses: Bogdanp/setup-racket@v1.15
        with:
          version: stable
          distribution: full

      - name: Install glaze
        run: raco pkg install --auto --no-docs --skip-installed git+https://github.com/turlamai/glaze.git#1fd99a53d0efde9473d960b73214b2513b0a60f8

      - name: Install switchboard
        run: raco pkg install --auto --no-docs --skip-installed git+https://github.com/turlamai/switchboard.git#main

      # The installer toolchains glaze degrades across: dpkg-deb is stock
      # on ubuntu runners, rpmbuild comes from apt, appimagetool ships as
      # an AppImage (run with APPIMAGE_EXTRACT_AND_RUN=1 — no FUSE on CI).
      - name: Install packaging toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm
          curl -sL -o /usr/local/bin/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /usr/local/bin/appimagetool
          appimagetool --version || true

      - name: Package
        run: |
          # --installer runs glaze's native installer chain (it silently
          # degrades to tar.gz without toolchains — the test -f gates
          # below turn that into a hard failure).
          raco glaze build \
            --entry backend/main.rkt \
            --name TermPilot \
            --version "$VERSION" \
            --installer \
            --out dist
          # glaze emits TermPilot.{deb,rpm,AppImage} (app-name case, no
          # version); rename to the family asset form.
          test -f dist/TermPilot.deb
          test -f dist/TermPilot.rpm
          test -f dist/TermPilot.AppImage
          mv dist/TermPilot.deb      "termpilot-$VERSION-linux-x64.deb"
          mv dist/TermPilot.rpm      "termpilot-$VERSION-linux-x64.rpm"
          mv dist/TermPilot.AppImage "termpilot-$VERSION-linux-x64.AppImage"

      - name: Tarball (the portable runtime, installers excluded)
        run: |
          (cd dist && tar czf "../termpilot-$VERSION-linux-x64.tar.gz" \
            $(ls | grep -v -E '\.(sha256|deb|rpm|AppImage)$'))

      - name: Per-asset .sha256 sidecars
        run: |
          for f in termpilot-$VERSION-linux-x64.tar.gz \
                   termpilot-$VERSION-linux-x64.deb \
                   termpilot-$VERSION-linux-x64.rpm \
                   termpilot-$VERSION-linux-x64.AppImage; do
            sha256sum "$f" > "$f.sha256"
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: |
            termpilot-*-linux-x64.tar.gz
            termpilot-*-linux-x64.tar.gz.sha256
            termpilot-*-linux-x64.deb
            termpilot-*-linux-x64.deb.sha256
            termpilot-*-linux-x64.rpm
            termpilot-*-linux-x64.rpm.sha256
            termpilot-*-linux-x64.AppImage
            termpilot-*-linux-x64.AppImage.sha256
          if-no-files-found: error

  macos:
    name: macOS package (${{ matrix.arch }})
    needs: validate
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
          - arch: x64
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$(node -p "require('./package.json').version")"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - uses: Bogdanp/setup-racket@v1.15
        with:
          architecture: ${{ matrix.arch == 'arm64' && 'arm64' || 'x64' }}
          version: stable
          distribution: full

      - name: Install glaze
        run: raco pkg install --auto --no-docs --skip-installed git+https://github.com/turlamai/glaze.git#1fd99a53d0efde9473d960b73214b2513b0a60f8

      - name: Install switchboard
        run: raco pkg install --auto --no-docs --skip-installed git+https://github.com/turlamai/switchboard.git#main

      - name: App icon (icns from icon-1024.png)
        run: |
          ICONSET=dist/icon.iconset
          mkdir -p "$ICONSET"
          for spec in 16 32 128 256 512; do
            sips -z $spec $spec assets/icon-1024.png --out "$ICONSET/icon_${spec}x${spec}.png" >/dev/null
            dbl=$((spec * 2))
            sips -z $dbl $dbl assets/icon-1024.png --out "$ICONSET/icon_${spec}x${spec}@2x.png" >/dev/null
          done
          iconutil -c icns "$ICONSET" -o dist/TermPilot.icns
          rm -rf "$ICONSET"

      - name: Package app bundle
        run: |
          raco glaze build \
            --entry backend/main.rkt \
            --name TermPilot \
            --version "$VERSION" \
            --icon dist/TermPilot.icns \
            --sign - \
            --out dist

      - name: Portable zip (.app at the archive root)
        run: |
          (cd dist && zip -qry "../termpilot-$VERSION-macos-${{ matrix.arch }}.zip" TermPilot.app)

      - name: DMG (drag to Applications)
        run: |
          set -euo pipefail
          dmg="termpilot-$VERSION-macos-${{ matrix.arch }}.dmg"
          staging="$(mktemp -d)/dmg-stage"
          mkdir -p "$staging"
          cp -R dist/TermPilot.app "$staging/"
          ln -s /Applications "$staging/Applications"
          created=""
          for attempt in 1 2 3; do
            if hdiutil create -volname TermPilot -srcfolder "$staging" -ov -format UDZO "$dmg"; then
              created="yes"; break
            fi
            echo "hdiutil create attempt $attempt failed; retrying in 5s"
            sleep 5
          done
          [ -n "$created" ] || { echo "::error::hdiutil create failed after 3 attempts"; exit 1; }

      - name: Per-asset .sha256 sidecars
        run: |
          for f in termpilot-$VERSION-macos-${{ matrix.arch }}.zip termpilot-$VERSION-macos-${{ matrix.arch }}.dmg; do
            shasum -a 256 "$f" > "$f.sha256"
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: |
            termpilot-*-macos-*.zip
            termpilot-*-macos-*.dmg
            termpilot-*-macos-*.sha256
          if-no-files-found: error

  windows:
    name: Windows package
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$(node -p "require('./package.json').version")"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - uses: Bogdanp/setup-racket@v1.15
        with:
          version: stable
          distribution: full

      - name: Install glaze
        run: raco pkg install --auto --no-docs --skip-installed git+https://github.com/turlamai/glaze.git#1fd99a53d0efde9473d960b73214b2513b0a60f8

      - name: Install switchboard
        run: raco pkg install --auto --no-docs --skip-installed git+https://github.com/turlamai/switchboard.git#main

      # WiX pinned to v5.0.2 like the taskly release pipeline: v7 gates
      # builds behind the OSMF EULA acceptance (WIX7015). glaze falls
      # back to NSIS, then zip, by tool availability.
      - name: Install WiX (v5; the family MSI toolchain)
        shell: bash
        run: dotnet tool install --global wix --version 5.0.2

      - name: Package
        shell: bash
        run: |
          # --installer runs glaze's native installer chain (WiX MSI,
          # falling back to NSIS/zip by tool availability — the test -f
          # gate below makes a silent degradation a hard failure).
          raco glaze build \
            --entry backend/main.rkt \
            --name TermPilot \
            --version "$VERSION" \
            --installer \
            --out dist
          # glaze emits TermPilot.msi (no version in the name); rename
          # to the family asset form.
          test -f dist/TermPilot.msi
          mv dist/TermPilot.msi "termpilot-$VERSION-windows-x64.msi"

      - name: Portable zip
        shell: pwsh
        run: |
          Compress-Archive -Path dist/* -DestinationPath "termpilot-$env:VERSION-windows-x64.zip"

      - name: Per-asset .sha256 sidecars
        shell: bash
        run: |
          sha256sum termpilot-$VERSION-windows-x64.zip > termpilot-$VERSION-windows-x64.zip.sha256
          sha256sum termpilot-$VERSION-windows-x64.msi > termpilot-$VERSION-windows-x64.msi.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            termpilot-*-windows-x64.zip
            termpilot-*-windows-x64.zip.sha256
            termpilot-*-windows-x64.msi
            termpilot-*-windows-x64.msi.sha256
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Extract changelog section
        run: |
          # index() = fixed-string match; ver contains regex metachars ([)
          awk -v ver="## [$VERSION]" '
            index($0, ver) { seen=1; next }
            seen && /^## \[/ { exit }
            seen { print }' \
            CHANGELOG.md > RELEASE-NOTES.md
          test -s RELEASE-NOTES.md || { echo "::error::empty release notes"; exit 1; }

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 0.x versions are development previews — marked as prereleases
          # (family precedent: taskly). 1.0+ publishes as stable.
          if [[ "$VERSION" == 0.* ]]; then EXTRA="--prerelease"; fi
          gh release create "v$VERSION" \
            --title "TermPilot v$VERSION" \
            --notes-file RELEASE-NOTES.md \
            $EXTRA \
            artifacts/*

      - name: Publish update manifest (site/update-manifest.json)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The app's updater reads this JSON from termpilot.jrtx.site
          # (Pages) and compares `version` against its own. `url` opens
          # the release page — notify-and-open until the 1.0 signed
          # auto-install chain exists.
          NOTES=$(head -c 400 RELEASE-NOTES.md | tr '\n' ' ')
          cat > site/update-manifest.json <<EOF
          {
            "version": "$VERSION",
            "url": "https://github.com/turlamai/termpilot/releases/tag/v$VERSION",
            "notes": "$NOTES"
          }
          EOF
          git config user.name "release-bot"
          git config user.email "release-bot@users.noreply.github.com"
          git add site/update-manifest.json
          git commit -m "update manifest: v$VERSION" || { echo "no manifest change"; exit 0; }
          git push origin HEAD:main
      # A GITHUB_TOKEN push never triggers other workflows (recursion
      # guard), so pages.yml (paths: site/**) would silently stay on
      # the previous release. workflow_dispatch is one of the two
      # documented exceptions — dispatch it explicitly.
      - name: Deploy Pages (manifest push cannot trigger it)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
