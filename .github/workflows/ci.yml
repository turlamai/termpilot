name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm check

      - name: Build frontend
        run: pnpm build

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Bogdanp/setup-racket@v1.15
        with:
          version: stable
          distribution: full

      # Pinned to the glaze head this slice was built against; flip to
      # the next tagged release once it exists.
      - name: Install glaze
        run: raco pkg install --auto --no-docs --skip-installed git+https://github.com/turlamai/glaze.git#1fd99a53d0efde9473d960b73214b2513b0a60f8

      - name: Install switchboard
        run: raco pkg install --auto --no-docs --skip-installed git+https://github.com/turlamai/switchboard.git#main

      - name: Diagnose script bridge (util-linux dialect)
        run: |
          script --version | head -1
          echo probe | script -q -f -c "cat" /dev/null | head -3
          true

      - name: Backend tests (unit + pty smoke)
        run: |
          set -o pipefail
          racket backend/tests/unit-test.rkt
          racket backend/tests/pty-smoke.rkt
        env:
          TERMPILOT_DATA_DIR: /tmp/termpilot-test-data

      - name: Application schema compatibility
        run: raco glaze schema check --json

  windows-compile:
    # The ConPTY backend only compiles everywhere; runtime validation
    # belongs to the Windows leg. Catch compile breaks early here.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Bogdanp/setup-racket@v1.15
        with:
          version: stable
          distribution: full

      - name: Install glaze
        run: raco pkg install --auto --no-docs --skip-installed git+https://github.com/turlamai/glaze.git#1fd99a53d0efde9473d960b73214b2513b0a60f8

      - name: Install switchboard
        run: raco pkg install --auto --no-docs --skip-installed git+https://github.com/turlamai/switchboard.git#main

      - name: Compile backend (including ConPTY path)
        run: raco make backend/main.rkt

  package-smoke:
    # Build the distributable on Linux to catch packaging breaks before
    # a release tag; full three-platform packaging lives in release.yml.
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    steps:
      - name: Install WebKitGTK and Xvfb (glaze Linux runtime)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev xvfb
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - uses: Bogdanp/setup-racket@v1.15
        with:
          version: stable
          distribution: full

      - name: Install glaze
        run: raco pkg install --auto --no-docs --skip-installed git+https://github.com/turlamai/glaze.git#1fd99a53d0efde9473d960b73214b2513b0a60f8

      - name: Install switchboard
        run: raco pkg install --auto --no-docs --skip-installed git+https://github.com/turlamai/switchboard.git#main

      - name: Package (Linux)
        run: |
          raco glaze build \
            --entry backend/main.rkt \
            --name TermPilot \
            --version 0.1.0 \
            --out dist
        env:
          TERMPILOT_SELFTEST: "0"

      - name: HTTP adapter smoke (packaged binary serves API and frontend)
        run: |
          set -euo pipefail
          export WEBKIT_DISABLE_DMABUF_RENDERER=1
          data_dir="$(mktemp -d)"
          export TERMPILOT_TRANSPORT=http TERMPILOT_DATA_DIR="$data_dir" GLAZE_API_TOKEN=smoke-token
          BIN="$(find dist -type f \( -name 'TermPilot' -o -name 'TermPilot.*' \) ! -name '*.sha256' | head -1)"
          test -n "$BIN" || { echo "::error::packaged binary not found"; ls -R dist | head -40; exit 1; }
          chmod +x "$BIN"
          cd "$(dirname "$BIN")"
          setsid xvfb-run -a "./$(basename "$BIN")" &
          run_pid=$!
          trap 'kill -9 -- "-$run_pid" 2>/dev/null || true' exit
          # setsid detaches the app from $!, so probe every listening TCP
          # port system-wide; the token-protected health endpoint decides
          # which port is the app (family policy).
          port=""
          for _ in $(seq 1 15); do
            sleep 2
            kill -0 "$run_pid" 2>/dev/null || { echo "::error::packaged app exited early"; exit 1; }
            ports="$(lsof -iTCP -sTCP:LISTEN -P -n 2>/dev/null | grep -oE ':[0-9]+' | tr -d ':' | sort -u || true)"
            for p in $ports; do
              if curl -fsS -m 5 -X POST -H "X-Glaze-Token: smoke-token" "http://127.0.0.1:$p/api/health" 2>/dev/null | grep -q '"ok":true'; then
                port="$p"; break
              fi
            done
            [ -n "$port" ] && break
          done
          [ -n "$port" ] || { echo "::error::packaged app never listened"; exit 1; }
          code="$(curl -s -o /dev/null -w '%{http_code}' -m 5 "http://127.0.0.1:$port/")"
          [ "$code" = "200" ] || { echo "::error::frontend returned $code"; exit 1; }
