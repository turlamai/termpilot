# Flatpak bundle manifest for the release payload (issue: the Linux
# distribution contract — deb+rpm+AppImage+Flatpak+tar.gz).
#
# CI renders the __VERSION__ / __ARCH__ / __SHA256__ placeholders from the
# linux tar.gz it just built and writes the generated manifest to the repo
# root (see .github/workflows/release.yml, the Flatpak step; the same steps
# run per-commit in flatpak-smoke.yml against the latest release):
#
#   sed -e "s/__VERSION__/.../" -e "s/__ARCH__/.../" -e "s/__SHA256__/.../" \
#     flatpak/site.jrtx.termpilot.yml > site.jrtx.termpilot.gen.yml
#   flatpak-builder --user --force-clean --repo=repo build-dir site.jrtx.termpilot.gen.yml
#   flatpak build-bundle repo termpilot-<v>-linux-<arch>.flatpak site.jrtx.termpilot
#
# The payload is self-contained (embedded Racket CS runtime under lib/plt,
# the built frontend under public/). Dependency closure vs the GNOME
# Platform runtime, measured on the release tar.gz with readelf (same
# result as the hackdigest glaze payload): the launcher and the racketcs
# runtime declare exactly glibc (libc/dl/m/pthread/rt) + libz.so.1 as
# NEEDED — all in the runtime — so unlike the rivet-line payloads there
# are NO extra modules (no lz4, no ncurses). What the launcher loads
# dynamically: glaze's webview dlopens gtk-3 and webkit2gtk-4.1 (the
# GNOME runtime hosts Epiphany, so both ship there), and the updater's
# crypto package FFI-loads libssl.so.3 / libcrypto.so.3 — OpenSSL 3 is
# part of the GNOME runtime since 48 (gnome-build-meta#1134). The app's
# own outbound traffic (SSH/SFTP via the OpenSSH sidecar, LLM endpoints,
# the update check) needs the network permission below.
app-id: site.jrtx.termpilot
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: TermPilot
# The release contract bundles from branch `stable` (build-bundle arg);
# builder otherwise commits to master.
branch: stable
separate-locales: false
finish-args:
  # glaze's prefer_xwayland_backend() picks X11 exactly when DISPLAY is
  # set and WAYLAND_DISPLAY is not; granting only the X11 socket keeps
  # that decision deterministic.
  - --socket=x11
  - --device=dri
  - --share=ipc
  # SSH sessions run through the OpenSSH sidecar inside the sandbox; LLM
  # endpoints and the update check leave the sandbox too.
  - --share=network
modules:
  - name: termpilot
    buildsystem: simple
    build-options:
      # The payload's launchers (bin/TermPilot) carry the whole program in a
      # non-alloc ELF section (.rackprog; racketcs-9.3 embeds its boot the
      # same way). flatpak-builder's debuginfo extraction (on by default)
      # strips those files, which drops non-alloc sections: the launcher
      # survives as a ~15KB stub and dies at startup with "read failed to
      # read all N bytes from file ... at offset ..." (reproduced locally
      # and in every smoke leg so far). The payload ships prebuilt — keep
      # it byte-exact.
      no-debuginfo: true
    sources:
      - type: archive
        # The release tarball is flat (bin/, lib/ at the root, no leading
        # top-level directory); flatpak-builder's default
        # strip-components=1 strips the FIRST path component off every
        # entry (observed in the first smoke run — bin/lib vanished).
        # Keep the layout exactly as packaged.
        strip-components: 0
        path: termpilot-__VERSION__-linux-__ARCH__.tar.gz
        sha256: __SHA256__
      - type: file
        path: assets/icon-512.png
      - type: file
        path: flatpak/site.jrtx.termpilot.desktop
    build-commands:
      # flatpak-builder strips the archive's leading directory: the payload
      # (bin/, lib/) lands flat in the build dir.
      - mkdir -p /app/termpilot
      - cp -a bin lib /app/termpilot/
      # The bundle's `command` resolves on the sandbox PATH (/app/bin); the
      # payload lives outside it. A wrapper execs the real binary, so
      # /proc/self/exe still resolves to it (runtime layout discovery
      # keeps working). The redirect is required, not cosmetic: /app is
      # mounted read-only in the sandbox and the payload launcher pins
      # find-system-path 'config-dir inside the payload (ustart passes
      # -G/-X pointing at a payload-relative etc/), so the default data
      # dir resolution lands on a read-only path. $XDG_CONFIG_HOME is
      # flatpak's per-app writable dir (~/.var/app/<app-id>/config).
      - mkdir -p /app/bin
      - |
        cat > /app/bin/TermPilot <<'EOF'
        #!/bin/sh
        : "${TERMPILOT_DATA_DIR:=${XDG_CONFIG_HOME:-$HOME/.config}/termpilot}"
        export TERMPILOT_DATA_DIR
        exec /app/termpilot/bin/TermPilot
        EOF
        chmod +x /app/bin/TermPilot
      - install -Dm644 icon-512.png
                    /app/share/icons/hicolor/512x512/apps/site.jrtx.termpilot.png
      - install -Dm644 site.jrtx.termpilot.desktop
                    /app/share/applications/site.jrtx.termpilot.desktop
